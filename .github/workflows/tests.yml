name: tests

# Runs the test suite on every push and pull request. No secrets are used: every test runs
# against fakes or a local Spark, never against Databricks or the UFCalendar API.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (app, ingestion, cleaning rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  spark:
    name: Bronze and silver on local Spark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
      - run: pip install -r requirements-dev.txt pyspark==3.5.3 delta-spark==3.2.1
      - run: python -m pytest -q tests/test_bronze_spark_local.py tests/test_silver_spark_local.py
