# Databricks Asset Bundle: the UFCalendar ingestion as serverless jobs.
# Deploy:  databricks bundle deploy
# Run:     databricks bundle run ufcalendar_incremental
# Auth: no profile is set here, so the CLI uses DATABRICKS_HOST and DATABRICKS_TOKEN when present (cloud sessions).
# On the laptop add `-p mma` to each command, or `export DATABRICKS_CONFIG_PROFILE=mma`.
bundle:
  name: mma-intelligence

sync:
  exclude:
    - docs/**
    - tests/**

variables:
  landing_dir:
    default: /Volumes/mma/raw/landing/ufcalendar
  incremental_schedule_status:
    description: PAUSED or UNPAUSED
    default: UNPAUSED
  # Plan-dependent settings. Free plan (1,000/month, 10/min) values below; on Hobby
  # (30,000/month, 60/min) incremental_rpm=55, incremental_budget=600. Four orgs fit the free plan
  # (rough estimate 500 to 700 requests/month); if quota runs short, set incremental_orgs=ufc.
  incremental_orgs:
    description: Comma-separated org slugs, in priority order
    default: ufc,pfl,oktagon,rizin
  incremental_rpm:
    description: Client-side requests per minute (keep below the plan limit)
    default: "8"
  incremental_budget:
    description: Max API requests per incremental run
    default: "100"
  backfill_schedule_status:
    description: PAUSED or UNPAUSED. UNPAUSED only while the key is on Hobby or above (Hobby until 2026-12-22).
    default: PAUSED

resources:
  jobs:
    ufcalendar_incremental:
      name: ufcalendar-incremental
      description: >-
        Recent UFC events, odds, round stats and fighters into the landing volume.
        Incremental via the manifest; safe on the free plan (about 1 request when nothing changed).
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 6 */3 * ?"  # 06:00 on every third day of the month
        timezone_id: Europe/Amsterdam
        pause_status: ${var.incremental_schedule_status}
      tasks:
        - task_key: ingest
          environment_key: ingest_env
          spark_python_task:
            python_file: ./jobs/run_ufcalendar.py
            parameters:
              - --org=${var.incremental_orgs}
              - --max-events=10
              - --budget=${var.incremental_budget}
              - --rpm=${var.incremental_rpm}
              - --output-dir=${var.landing_dir}
              - --log-dir=/tmp/ufcalendar_logs
              - --secret-scope=mma
      environments:
        - environment_key: ingest_env
          spec:
            environment_version: "4"
            dependencies:
              - requests>=2.32
              - python-dotenv>=1.0

    ufcalendar_backfill:
      name: ufcalendar-backfill
      description: >-
        Full history in chunks of 3,000 requests (about 1 hour) by default; set the budget job parameter
        higher for one long run (progress is saved every 25 requests, so a stopped run resumes). Orgs run in the order given, so UFC
        finishes before PFL, OKTAGON and RIZIN start. Run repeatedly until it fetches almost nothing.
        Refuses to run unless the key is on a plan with at least 30,000 requests/month (Hobby).
        To change scope or chunk size use "Run now with different parameters" on the job
        parameters below; do not override the task's python_params (that drops the plan guard).
      max_concurrent_runs: 1
      timeout_seconds: 21600  # 6 h: room for one long run (budget up to about 18,000 at 55/min)
      parameters:
        - name: orgs
          default: ufc,pfl,oktagon,rizin
        - name: budget
          default: "3000"
      schedule:
        quartz_cron_expression: "0 0 14 * * ?"  # daily 14:00 Amsterdam, clear of the 06:00 incremental
        timezone_id: Europe/Amsterdam
        pause_status: ${var.backfill_schedule_status}
      tasks:
        - task_key: ingest
          environment_key: ingest_env
          spark_python_task:
            python_file: ./jobs/run_ufcalendar.py
            parameters:
              - "--org={{job.parameters.orgs}}"
              - "--budget={{job.parameters.budget}}"
              - --rpm=55
              - --min-plan-quota=30000
              - --output-dir=${var.landing_dir}
              - --log-dir=/tmp/ufcalendar_logs
              - --secret-scope=mma
      environments:
        - environment_key: ingest_env
          spec:
            environment_version: "4"
            dependencies:
              - requests>=2.32
              - python-dotenv>=1.0

targets:
  default:
    default: true
